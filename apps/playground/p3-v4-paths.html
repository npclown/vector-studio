<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>P3 V4 path playground (UNVERIFIED precision)</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #080d17;
        color: #e8edf7;
      }
      body {
        margin: 0;
        padding: 16px;
        display: grid;
        grid-template-columns: 720px minmax(280px, 1fr);
        gap: 16px;
        align-items: start;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 16px;
        font-weight: 650;
      }
      #p3-v4-surface {
        display: block;
        width: 720px;
        height: 450px;
        cursor: grab;
        touch-action: none;
      }
      #p3-v4-surface.dragging {
        cursor: grabbing;
      }
      .label {
        margin: 8px 0 0;
        font-size: 12px;
        color: #ffd27d;
      }
      .panel {
        font-size: 12px;
      }
      .panel h2 {
        margin: 12px 0 6px;
        font-size: 13px;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      button {
        min-height: 28px;
        border: 1px solid #394a67;
        border-radius: 6px;
        background: #17233a;
        color: inherit;
        cursor: pointer;
      }
      dl {
        display: grid;
        grid-template-columns: 130px 1fr;
        gap: 4px 8px;
        margin: 0;
      }
      dt {
        color: #8fa0ba;
      }
      dd {
        margin: 0;
        font-family: ui-monospace, Consolas, monospace;
        overflow-wrap: anywhere;
      }
      ol {
        margin: 0;
        padding-left: 18px;
      }
      #p3-v4-diagnostics {
        max-height: 200px;
        overflow: auto;
        font:
          11px/1.4 ui-monospace,
          Consolas,
          monospace;
      }
      #p3-v4-diagnostics li[data-severity='warning'] {
        color: #ffd27d;
      }
      #p3-v4-diagnostics li[data-severity='error'] {
        color: #ff9da5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>P3 V4 path playground: real fill-mesh port (WASM kernel)</h1>
      <canvas id="p3-v4-surface" aria-label="Path rendering surface"></canvas>
      <p class="label">
        UNVERIFIED: precision is UNVERIFIED against the 0.25 physical-pixel target until A04
        evidence exists. Drag to pan, wheel to zoom, Q/E or the slider to rotate.
      </p>
    </main>
    <section class="panel" aria-label="Controls and status">
      <div class="controls">
        <button type="button" id="p3-v4-zoom-in">Zoom in</button>
        <button type="button" id="p3-v4-zoom-out">Zoom out</button>
        <button type="button" id="p3-v4-reset">Reset view</button>
        <label
          >Rotation <input id="p3-v4-rotation" type="range" min="-180" max="180" step="1" value="0"
        /></label>
      </div>
      <h2>View and pipeline</h2>
      <dl id="p3-v4-status"></dl>
      <h2>Paths, in paint order</h2>
      <ol id="p3-v4-paths"></ol>
      <h2>Diagnostics</h2>
      <ol id="p3-v4-diagnostics"></ol>
    </section>
    <script type="module" src="/src/p3-v4-paths.ts"></script>
  </body>
</html>
