[package]
name = "vector-studio-geometry-kernel"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
# P3 B0 diagnostic instrumentation (docs/plans/p3-b0-feasibility-benchmark-contract.md).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(p3_b0_diag)"] }

[lints.clippy]
all = "deny"
