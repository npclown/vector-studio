name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Static, unit, boundaries, and build
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run deterministic checks
        run: pnpm check

      - name: Build production artifacts
        run: pnpm build

      - name: Install approved pinned Rust toolchain
        run: pwsh -NoProfile -File tooling/install-rust.ps1

      - name: Validate native Rust and independent WASM fixtures
        run: pnpm test:geometry

      - name: Validate bounded P3 cubic readiness tooling
        run: node tooling/run-p3-cubic-census.mjs --smoke
