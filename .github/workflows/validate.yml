name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A new push to a pull request supersedes its running validation; each main push is validated.
concurrency:
  group: validate-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether the geometry jobs run: always on a main push, and on a pull request unless every
  # changed file is on the geometry-free allow-list of tooling/ci-geometry-scope.mjs.
  scope:
    name: Geometry job scope
    runs-on: ubuntu-latest
    outputs:
      geometry: ${{ steps.scope.outputs.geometry }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node tooling/ci-geometry-scope.mjs "$BASE" "$HEAD" >> "$GITHUB_OUTPUT"

  static:
    name: Static, unit and build
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run deterministic checks
        run: pnpm check

      - name: Build production artifacts
        run: pnpm build

  geometry-native:
    name: Geometry native Rust, WASM identity and census smoke
    needs: scope
    if: needs.scope.outputs.geometry == 'true'
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production artifacts
        run: pnpm build

      - name: Install approved pinned Rust toolchain
        run: pwsh -NoProfile -File tooling/install-rust.ps1

      - name: Validate native Rust and independent WASM fixtures
        run: node tooling/test-geometry.mjs --native-only

      - name: Validate bounded P3 cubic readiness tooling
        run: node tooling/run-p3-cubic-census.mjs --smoke

      - name: Validate historical polygon relation tooling
        run: node tooling/run-p3-polygon-census.mjs --smoke

  geometry-vitest:
    name: Geometry vitest shard ${{ matrix.shard }}/4
    needs: scope
    if: needs.scope.outputs.geometry == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production artifacts
        run: pnpm build

      - name: Install approved pinned Rust toolchain
        run: pwsh -NoProfile -File tooling/install-rust.ps1

      - name: Validate geometry against native Rust and release WASM
        run: node tooling/test-geometry.mjs --shard=${{ matrix.shard }}/4

  # Keeps the required check name of the former single job; passes only when every job above did,
  # the geometry jobs counting as passed when the scope job decided to skip them.
  validate:
    name: Static, unit, boundaries, and build
    if: always()
    needs: [scope, static, geometry-native, geometry-vitest]
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation job to succeed
        env:
          SCOPE: ${{ needs.scope.result }}
          GEOMETRY: ${{ needs.scope.outputs.geometry }}
          STATIC: ${{ needs.static.result }}
          NATIVE: ${{ needs.geometry-native.result }}
          VITEST: ${{ needs.geometry-vitest.result }}
        run: |
          echo "scope=$SCOPE geometry=$GEOMETRY static=$STATIC native=$NATIVE vitest=$VITEST"
          if [ "$SCOPE" != "success" ] || [ "$STATIC" != "success" ]; then exit 1; fi
          if [ "$GEOMETRY" = "false" ]; then
            if [ "$NATIVE" != "skipped" ] || [ "$VITEST" != "skipped" ]; then exit 1; fi
            echo "Geometry jobs skipped: every changed file is geometry-free."
            exit 0
          fi
          if [ "$NATIVE" != "success" ] || [ "$VITEST" != "success" ]; then exit 1; fi
